name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # Meme image que generate-reels.yml (voir build-image.yml / Dockerfile) :
    # deps deja installees, plus besoin de pip install (dont torch/whisper,
    # le plus long) a chaque push.
    container:
      image: ghcr.io/phenixi89/realgen-pipeline:latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Compile check (syntax)
        run: python -m py_compile scripts/*.py

      - name: Import check
        run: |
          python -c "import ast, pathlib
          for f in pathlib.Path('scripts').glob('*.py'):
              ast.parse(f.read_text(encoding='utf-8'), filename=str(f))
          print('OK: tous les scripts parsent correctement')"

      - name: Valide le catalogue (catalog/*.json)
        run: python scripts/catalog.py

      - name: Vérifie run_pipeline.py --help
        run: python scripts/run_pipeline.py --help

      - name: Vérifie chaque étape --help
        run: |
          for f in scripts/1_generate_script.py scripts/2_generate_voice.py scripts/3_record_demo.py scripts/3b_build_video_from_screenshots.py scripts/3c_build_video_from_recording.py scripts/4_generate_subtitles.py scripts/5_assemble.py scripts/render_js_anim.py scripts/audio_gen.py scripts/apercus.py; do
            echo "== $f =="
            python "$f" --help
          done
