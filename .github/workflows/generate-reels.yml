name: Generate Reels

on:
  schedule:
    - cron: "0 8 * * 1" # chaque lundi 08:00 UTC
  workflow_dispatch:
    inputs:
      n:
        description: "Nombre de reels a generer"
        required: false
        default: "3"
      voice:
        description: "Voix TTS Gemini"
        required: false
        default: "Kore"
      force:
        description: "Ignorer toute reprise et tout regenerer depuis zero"
        type: boolean
        required: false
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      # fonts-dejavu-core : la police des sous-titres brules (5_assemble.py).
      # Sans elle, fontconfig substitue silencieusement une police par
      # defaut differente de celle configuree, rendu moins net/coherent.
      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      # Persiste output/ entre les runs : si le pipeline echoue en cours de
      # route (ex: etape 3), le prochain run reprend la ou il s'est arrete
      # au lieu de regenerer les scripts/voix (appels Gemini deja payes).
      # restore-keys reprend le cache le plus recent disponible ; une cle
      # unique par run_id est sauvegardee a la fin (meme si le job echoue).
      - name: Restore pipeline output (reprise)
        if: ${{ github.event.inputs.force != 'true' }}
        uses: actions/cache@v4
        with:
          path: output
          key: reels-output-${{ github.run_id }}
          restore-keys: |
            reels-output-

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          python scripts/run_pipeline.py \
            --n "${{ github.event.inputs.n || '3' }}" \
            --saas-url "${{ vars.SAAS_URL }}" \
            --voice "${{ github.event.inputs.voice || 'Kore' }}" \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # if: always() -- meme si le pipeline echoue en route (ex: etape 3),
      # on veut recuperer ce qui a deja ete genere (scripts, audio, video,
      # screenshot de debug) plutot que rien du tout.
      - name: Upload output (reels + debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            output/final/
            output/audio/
            output/scripts.json
            output/video/
            output/debug/
          if-no-files-found: ignore
