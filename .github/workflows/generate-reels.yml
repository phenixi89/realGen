name: Generate Reels

on:
  schedule:
    - cron: "0 8 * * 1" # chaque lundi 08:00 UTC
  workflow_dispatch:
    inputs:
      n:
        description: "Nombre de reels a generer"
        required: false
        default: "3"
      voice:
        description: "Voix TTS Gemini"
        required: false
        default: "Kore"
      force:
        description: "Ignorer toute reprise et tout regenerer depuis zero"
        type: boolean
        required: false
        default: false
      capture_mode:
        description: "video (mobile) / screenshots (desktop, zoom in/out) / video_desktop (desktop, recadre sur chaque fonctionnalite)"
        type: choice
        options:
          - video
          - screenshots
          - video_desktop
        required: false
        default: video
      anims:
        description: "Animations HTML/JS (scene/highlight : capture_mode screenshots uniquement)"
        type: choice
        options:
          - none
          - all
          - overlay
          - scene
          - highlight
          - overlay,scene
          - overlay,highlight
          - scene,highlight
        required: false
        default: none
      format:
        description: "Format impose (catalog/formats.json), vide = choix automatique selon le mix conseil/produit"
        required: false
        default: ""
      theme:
        description: "Theme visuel impose (catalog/themes.json), vide = rotation"
        required: false
        default: ""
      from_step:
        description: "Regenerer a partir de cette etape (et les suivantes), ignore le cache pour elles. Vide = reprise normale."
        type: choice
        options:
          - ""
          - script
          - voice
          - video
          - subs
          - assemble
        required: false
        default: ""
      duration:
        description: "Duree cible de chaque reel (secondes)"
        type: choice
        options:
          - "15"
          - "30"
          - "45"
          - "60"
        required: false
        default: "30"
      angle:
        description: "Angle marketing libre (optionnel, sinon rotation automatique)"
        required: false
        default: ""
      scenario:
        description: "Chemin d'un scenario ecrit a la main dans le repo (optionnel, ex: scenarios/exemple.json)"
        required: false
        default: ""
      allow_ai_quota:
        description: "Autoriser les parcours qui consomment le quota IA du compte demo (simulation d'entretien)"
        type: boolean
        required: false
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Image pre-construite (voir build-image.yml / Dockerfile) : python,
    # deps pip (dont torch/whisper), navigateur Playwright et modele
    # Whisper "small" y sont deja installes -- plus rien a (re)installer a
    # chaque run, seul git checkout le code de scripts/.
    container:
      image: ghcr.io/phenixi89/realgen-pipeline:latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Reveille le service de demo (Render free tier se met en veille apres
      # inactivite, ~30-60s de cold start) en tache de fond, sans bloquer :
      # les etapes 1-2 (Gemini script/voix) tournent en parallele pendant
      # qu'il se reveille, au lieu d'attendre le cold-start plus tard,
      # bloquant en plein milieu du run, a l'etape 3 (Playwright).
      - name: Warm-up du service de demo (arriere-plan)
        run: |
          # `disown` est un builtin bash absent du shell minimal de l'image
          # (`sh`/dash) et de toute facon inutile ici : un `&` simple suffit
          # a detacher la commande sans qu'elle bloque cette etape.
          # Boucle plutot qu'un essai unique : un cold start peut depasser
          # le --max-time d'une seule requete (ex. instance qui vient tout
          # juste de recevoir un premier ping) -- 3_record_demo.py retente
          # aussi de son cote, ceci n'est qu'un coup de pouce en parallele.
          ( for i in 1 2 3; do
              curl -sS --max-time 90 -o /dev/null "${{ vars.SAAS_URL }}" && break
            done ) &

      # Persiste output/ entre les runs : si le pipeline echoue en cours de
      # route (ex: etape 3), le prochain run reprend la ou il s'est arrete
      # au lieu de regenerer les scripts/voix (appels Gemini deja payes).
      # restore-keys reprend le cache le plus recent disponible ; une cle
      # unique par run_id est sauvegardee a la fin (meme si le job echoue).
      - name: Restore pipeline output (reprise)
        if: ${{ github.event.inputs.force != 'true' }}
        uses: actions/cache@v4
        with:
          path: output
          key: reels-output-${{ github.run_id }}
          restore-keys: |
            reels-output-

      - name: Run pipeline
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          ALLOW_AI_QUOTA_FEATURES: ${{ github.event.inputs.allow_ai_quota == 'true' && '1' || '' }}
          # Texte libre : passe par l'environnement, jamais interpole dans le
          # script shell (sinon un angle contenant $(...) serait execute).
          INPUT_ANGLE: ${{ github.event.inputs.angle }}
          INPUT_SCENARIO: ${{ github.event.inputs.scenario }}
          INPUT_FORMAT: ${{ github.event.inputs.format }}
          INPUT_THEME: ${{ github.event.inputs.theme }}
        run: |
          extra=()
          [ -n "$INPUT_ANGLE" ] && extra+=(--angle "$INPUT_ANGLE")
          [ -n "$INPUT_SCENARIO" ] && extra+=(--scenario "$INPUT_SCENARIO")
          [ -n "$INPUT_FORMAT" ] && extra+=(--format "$INPUT_FORMAT")
          [ -n "$INPUT_THEME" ] && extra+=(--theme "$INPUT_THEME")
          python scripts/run_pipeline.py \
            --n "${{ github.event.inputs.n || '3' }}" \
            --duration "${{ github.event.inputs.duration || '30' }}" \
            --saas-url "${{ vars.SAAS_URL }}" \
            --voice "${{ github.event.inputs.voice || 'Kore' }}" \
            --capture-mode "${{ github.event.inputs.capture_mode || 'video' }}" \
            --anims "${{ github.event.inputs.anims || 'none' }}" \
            "${extra[@]}" \
            ${{ github.event.inputs.from_step && format('--from-step {0}', github.event.inputs.from_step) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # if: always() -- meme si le pipeline echoue en route (ex: etape 3),
      # on veut recuperer ce qui a deja ete genere (scripts, audio, video,
      # screenshot de debug) plutot que rien du tout.
      - name: Upload output (reels + debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            output/final/
            output/audio/
            output/scripts.json
            output/subs/
            output/video/
            output/debug/
          if-no-files-found: ignore
