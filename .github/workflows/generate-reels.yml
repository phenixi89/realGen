name: Generate Reels

on:
  schedule:
    - cron: "0 8 * * 1" # chaque lundi 08:00 UTC
  workflow_dispatch:
    inputs:
      n:
        description: "Nombre de reels a generer"
        required: false
        default: "3"
      voice:
        description: "Voix TTS Gemini"
        required: false
        default: "Kore"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/run_pipeline.py \
            --n "${{ github.event.inputs.n || '3' }}" \
            --saas-url "${{ vars.SAAS_URL }}" \
            --voice "${{ github.event.inputs.voice || 'Kore' }}"

      - name: Upload reels
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: output/final/
