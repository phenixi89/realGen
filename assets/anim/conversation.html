<!doctype html>
<!--
  Carte "conversation" : un echange de messages (fictif) sur un telephone --
  l'interlocuteur "ecrit..." (trois points), puis sa bulle apparait ; les
  messages du candidat partent a droite. Les bulles poussent les precedentes
  vers le haut, comme dans une vraie messagerie (style generique, aucune
  application reconnaissable).
  Parametres : contact (nom affiche, "Recruteur" par defaut), messages
  ("r:texte|m:texte|..." ; r = interlocuteur a gauche, m = moi a droite,
  4 max), surtitre, bg, dur + theme.
  Instants partages avec scripts/sound_design.py : FIRST_AT, slot(n), msgAt().
-->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="_card_base.css">
<style>
  #kwrap{position:absolute;top:230px;width:100%;text-align:center}
  #phone{position:absolute;left:100px;right:100px;top:350px;height:1170px;border-radius:70px;background:#0b1020;
    border:14px solid #05060b;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.08);overflow:hidden}
  #head{position:absolute;left:0;right:0;top:0;height:150px;display:flex;align-items:center;gap:26px;padding:24px 40px 0;
    background:rgba(255,255,255,.05);border-bottom:2px solid rgba(255,255,255,.07)}
  #avatar{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--c1fg);
    font:800 44px/88px TitleFont,"DejaVu Sans",sans-serif;text-align:center}
  #name{font-weight:800;font-size:44px;color:#f8fafc}
  #status{font-size:30px;color:#4ade80;margin-top:4px}
  #msgs{position:absolute;left:0;right:0;top:240px;bottom:0;padding:0 34px 40px;display:flex;flex-direction:column;justify-content:flex-end}
  .w{overflow:hidden;flex:none;display:flex}
  .w.m{justify-content:flex-end}
  .b{max-width:76%;margin-top:26px;padding:24px 32px;font-size:44px;line-height:1.25;color:#f8fafc;border-radius:38px;transform-origin:0 100%}
  .r .b{background:#1e293b;border-bottom-left-radius:10px}
  .m .b{background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 60%,var(--c2)));border-bottom-right-radius:10px;transform-origin:100% 100%;color:var(--c1fg)}
  .meta{font-size:24px;opacity:.65;margin-top:8px;text-align:right}
  .typing .b{display:flex;gap:14px;padding:30px 34px}
  #day{position:absolute;top:185px;width:100%;text-align:center}
  #day span{font-size:26px;color:#94a3b8;background:rgba(255,255,255,.06);padding:8px 22px;border-radius:99px}
  .typing i{width:18px;height:18px;border-radius:50%;background:#94a3b8;display:block}
</style></head><body>
<div id="bg"></div><div id="grad"></div><div id="grid"></div>
<div id="kwrap"><div class="kicker" id="kicker"></div></div>
<div id="phone">
  <div id="head"><div id="avatar"></div><div><div id="name"></div><div id="status">en ligne</div></div></div>
  <div id="day"><span>Aujourd'hui</span></div>
  <div id="msgs"></div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  const DUR = num("dur", 5), FIRST_AT = 0.35;
  const msgs = param("messages", "r:Bonjour, j'ai bien reçu votre CV.|m:Super, merci !|r:Par contre, je n'ai pas compris quel poste vous visez.")
    .split("|").map((s) => { const i = s.indexOf(":"); return { de: s.slice(0, i).trim() === "m" ? "m" : "r", texte: s.slice(i + 1).trim() }; })
    .filter((m) => m.texte).slice(0, 4);
  // Cadence calee sur la duree de la scene (identique dans sound_design.py).
  const slot = Math.min(1.8, Math.max(0.8, (DUR * 0.85 - FIRST_AT) / Math.max(msgs.length, 1)));
  const msgAt = (i) => FIRST_AT + i * slot + (msgs[i].de === "r" ? Math.max(0.35, slot * 0.45) : 0.15);
  const contact = param("contact", "Recruteur");
  document.getElementById("name").textContent = contact;
  document.getElementById("avatar").textContent = contact.trim()[0] || "R";
  const kicker = param("surtitre", ""); document.getElementById("kicker").textContent = kicker;
  if (!kicker) document.getElementById("kicker").style.display = "none";
  const bg = param("bg", ""); let bgReady = null;
  if (bg) { document.getElementById("bg").style.backgroundImage = `url("${bg}")`;
    bgReady = new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = bg; }); }

  const box = document.getElementById("msgs");
  const add = (cls, html) => { const w = document.createElement("div"); w.className = `w ${cls}`; w.innerHTML = html; box.appendChild(w); return w; };
  const items = msgs.map((m, i) => {
    const typing = m.de === "r" ? add("r typing", '<div class="b"><i></i><i></i><i></i></div>') : null;
    const w = add(m.de, '<div class="b"><div class="t"></div>' + (m.de === "m" ? '<div class="meta">Vu ✓✓</div>' : "") + "</div>");
    w.querySelector(".t").textContent = m.texte;
    return { w, typing, m, at: msgAt(i) };
  });

  FONTS_READY.then(() => {
    // Hauteurs naturelles mesurees une fois les polices chargees, puis
    // repliees a 0 : chaque bulle "pousse" les precedentes en apparaissant.
    const h = (w) => w.getBoundingClientRect().height;
    items.forEach((it) => { it.h = h(it.w); if (it.typing) it.th = h(it.typing); });
    const status = document.getElementById("status");
    const tl = gsap.timeline({ paused: true })
      .fromTo("#bg", { scale: 1.15 }, { scale: 1, duration: 10, ease: "none" }, 0)
      .from("#kicker", { y: -40, opacity: 0, scale: 0.7, duration: 0.4, ease: "back.out(2.2)" }, 0.05)
      .from("#phone", { y: 120, opacity: 0, duration: 0.45, ease: "power3.out" }, 0);
    items.forEach((it, i) => {
      gsap.set(it.w, { height: 0 });
      if (it.typing) {
        const t0 = FIRST_AT + i * slot;
        gsap.set(it.typing, { height: 0 });
        tl.to(it.typing, { height: it.th, duration: 0.2, ease: "power2.out" }, t0)
          .call(() => (status.textContent = "écrit…"), null, t0)
          .to(it.typing.querySelectorAll("i"), { y: -10, duration: 0.18, stagger: 0.09, yoyo: true, repeat: 3, ease: "sine.inOut" }, t0)
          .to(it.typing, { height: 0, duration: 0.12 }, it.at - 0.05)
          .call(() => (status.textContent = "en ligne"), null, it.at);
      }
      tl.to(it.w, { height: it.h, duration: 0.25, ease: "power2.out" }, it.at)
        .fromTo(it.w.querySelector(".b"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, it.at);
    });
    tl.to("#phone", { y: -12, duration: 2.2, repeat: 4, yoyo: true, ease: "sine.inOut" }, msgAt(items.length - 1) + 0.4);
    addAmbient(tl, 8);
    expose(tl, bgReady);
    window.DURATION = Math.min(msgAt(items.length - 1) + 0.8, DUR);
  });
</script></body></html>
