<!doctype html>
<!--
  Accroche d'ouverture (surimpression, 5_assemble.py) : texte en GRAND lisible
  DES LA PREMIERE IMAGE -- jamais de fondu d'entree depuis l'invisible, c'est
  ce qui se voit dans le flux avant que le spectateur decide de rester.
  Parametres : text, dur (duree d'affichage, s), + theme (common.js).
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
  #wrap{position:absolute;left:70px;right:70px;top:300px;text-align:center}
  #text{display:inline;font-family:TitleFont,"DejaVu Sans",sans-serif;font-weight:800;font-size:96px;line-height:1.28;color:var(--cfg);
    -webkit-box-decoration-break:clone;box-decoration-break:clone;padding:6px 26px;border-radius:22px;
    background:linear-gradient(90deg,var(--c1),var(--c2)) no-repeat;background-size:100% 100%;
    box-shadow:0 18px 50px rgba(0,0,0,.45);text-shadow:0 4px 14px rgba(0,0,0,.35)}
  #shine{position:absolute;inset:-20px;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);mix-blend-mode:overlay}
</style></head><body>
<div id="wrap"><span id="text"></span><div id="shine"></div></div>
<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  const text = param("text", "Ton CV passe-t-il les filtres ATS ?");
  const el = document.getElementById("text");
  el.textContent = text;
  if (text.length > 42) el.style.fontSize = "80px";
  const DUR = Math.max(num("dur", 2.6), 1.2);
  // Image 0 : deja lisible (echelle legerement superieure, qui se pose) --
  // le mouvement attire l'oeil sans jamais cacher le texte.
  const tl = gsap.timeline({ paused: true })
    .fromTo("#wrap", { scale: 1.12, rotate: -2 }, { scale: 1, rotate: 0, duration: 0.45, ease: "back.out(2.5)" }, 0)
    .fromTo("#shine", { x: "-100%" }, { x: "100%", duration: 0.7, ease: "power2.inOut" }, 0.35)
    .to("#wrap", { scale: 1.03, duration: Math.max(DUR - 0.9, 0.2), ease: "sine.inOut" }, 0.45)
    .to("#wrap", { opacity: 0, y: -50, scale: 0.94, duration: 0.3, ease: "power2.in" }, Math.max(DUR - 0.3, 0.5));
  expose(tl);
</script></body></html>
