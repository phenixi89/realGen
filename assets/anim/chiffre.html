<!doctype html>
<!--
  Carte "chiffre" : un grand nombre qui compte jusqu'a sa valeur, puis sa
  legende. Parametres : valeur (nombre, virgule ou point), unite ("%", "s",
  "x"...), titre (legende), surtitre, bg, dur + theme.
  Instants partages avec scripts/sound_design.py : COUNT_START, COUNT_DUR.
-->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="_card_base.css">
<style>
  #box{position:absolute;left:90px;right:90px;top:560px;text-align:center}
  #num{margin-top:40px;font-size:300px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,var(--cfg),color-mix(in srgb,var(--c2) 70%,var(--cfg)));-webkit-background-clip:text;background-clip:text;color:transparent}
  #unit{font-size:150px;margin-left:10px;color:var(--c2)}
  #legend{margin-top:20px;font-size:64px;line-height:1.2}
  #ring{position:absolute;left:50%;top:880px;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;
    border:6px solid color-mix(in srgb,var(--c1) 50%,transparent)}
</style></head><body>
<div id="bg"></div><div id="grad"></div><div id="grid"></div>
<div id="ring"></div>
<div id="box">
  <div class="kicker" id="kicker"></div>
  <div class="title" id="numwrap"><span id="num">0</span><span class="title" id="unit"></span></div>
  <div class="title" id="legend"></div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  const COUNT_START = 0.3, COUNT_DUR = 1.1;
  const raw = String(param("valeur", "75")).replace(",", ".");
  const target = parseFloat(raw) || 0, decimals = (raw.split(".")[1] || "").length;
  document.getElementById("unit").textContent = param("unite", "");
  document.getElementById("legend").textContent = param("titre", "");
  const kicker = param("surtitre", "");
  document.getElementById("kicker").textContent = kicker;
  if (!kicker) document.getElementById("kicker").style.display = "none";
  const bg = param("bg", ""); let bgReady = null;
  if (bg) { document.getElementById("bg").style.backgroundImage = `url("${bg}")`;
    bgReady = new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = bg; }); }
  const numEl = document.getElementById("num"), c = { v: 0 };
  const fmt = (v) => v.toFixed(decimals).replace(".", ",");
  const tl = gsap.timeline({ paused: true })
    .fromTo("#bg", { scale: 1.15 }, { scale: 1, duration: 10, ease: "none" }, 0)
    .from("#kicker", { y: -40, opacity: 0, scale: 0.7, duration: 0.4, ease: "back.out(2.2)" }, 0.05)
    .from("#numwrap", { scale: 0.6, opacity: 0, duration: 0.35, ease: "back.out(2)" }, 0.15)
    .to(c, { v: target, duration: COUNT_DUR, ease: "power2.out", onUpdate: () => (numEl.textContent = fmt(c.v)) }, COUNT_START)
    .fromTo("#ring", { scale: 0.3, opacity: 0.9 }, { scale: 1.25, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, COUNT_START + COUNT_DUR)
    .to("#numwrap", { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1 }, COUNT_START + COUNT_DUR)
    .from("#legend", { y: 40, opacity: 0, duration: 0.45, ease: "power3.out" }, COUNT_START + COUNT_DUR + 0.1)
    .to("#box", { y: -14, duration: 2.2, repeat: 4, yoyo: true, ease: "sine.inOut" }, 2.2);
  numEl.textContent = fmt(0);
  addAmbient(tl);
  expose(tl, bgReady);
  window.DURATION = 2.4;
</script></body></html>
