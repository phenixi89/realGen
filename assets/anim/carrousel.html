<!doctype html>
<!--
  Diapositive de carrousel Instagram (image fixe 1080x1350, format 4:5 du fil),
  rendue par scripts/instagram.py (render_js_anim.render_stills : etat final).
  Trois gabarits (?kind=) :
    couverture -> promesse du carrousel en tres grand, mot fort surligne, « Glisse »
    point      -> numero, titre, texte, barre de progression n/total, fleche
    fin        -> appel a l'action (enregistrer, lien en bio), bouton aux couleurs du theme
  Parametres : kind, n, total, titre, texte, marque (defaut OpusCV) + theme (common.js).
  Le texte trop long est reduit jusqu'a tenir dans sa zone.
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:var(--cbg);color:var(--cfg);
    font-family:TextFont,"DejaVu Sans",system-ui,sans-serif}
  #grad{position:absolute;inset:0;background:
    radial-gradient(circle at 12% 10%,color-mix(in srgb,var(--c1) 40%,transparent),transparent 50%),
    radial-gradient(circle at 92% 92%,color-mix(in srgb,var(--c2) 34%,transparent),transparent 55%)}
  #grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(var(--cfg) 1px,transparent 1px),linear-gradient(90deg,var(--cfg) 1px,transparent 1px);background-size:90px 90px}
  #top{position:absolute;left:80px;right:80px;top:70px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:34px}
  #brand{padding:12px 28px;border-radius:99px;background:var(--c1);color:var(--c1fg)}
  #count{opacity:.75;letter-spacing:.06em}
  #zone{position:absolute;left:90px;right:90px;top:220px;bottom:230px;display:flex;flex-direction:column;justify-content:center}
  #num{font-family:TitleFont,"DejaVu Sans",sans-serif;font-weight:800;font-size:150px;line-height:1;color:var(--c1);opacity:.9;margin-bottom:24px}
  #titre{font-family:TitleFont,"DejaVu Sans",sans-serif;font-weight:800;font-size:92px;line-height:1.08;letter-spacing:-.01em}
  #titre .hot{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--chl) 70%,transparent) 58% 92%,transparent 92%);padding:0 .08em}
  #rule{width:180px;height:12px;border-radius:8px;margin:44px 0 40px;background:linear-gradient(90deg,var(--c1),var(--c2))}
  #texte{font-size:50px;line-height:1.32;opacity:.93}
  #bottom{position:absolute;left:80px;right:80px;bottom:80px;display:flex;align-items:center;gap:30px;font-weight:800;font-size:36px}
  #bar{flex:1;height:10px;border-radius:6px;background:color-mix(in srgb,var(--cfg) 18%,transparent);overflow:hidden}
  #bar div{height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}
  #next{padding:14px 30px;border-radius:99px;border:3px solid var(--c1);color:var(--cfg);white-space:nowrap}
  #button{align-self:flex-start;margin-top:10px;padding:26px 54px;border-radius:99px;background:var(--c1);color:var(--c1fg);font-weight:800;font-size:48px;
    box-shadow:0 18px 50px color-mix(in srgb,var(--c1) 50%,transparent)}
  [data-kind="couverture"] #titre{font-size:118px;text-transform:uppercase}
  [data-kind="couverture"] #num,[data-kind="fin"] #num,[data-kind="fin"] #bar,[data-kind="couverture"] #bar{display:none}
  [data-kind="point"] #button,[data-kind="couverture"] #button{display:none}
  [data-kind="fin"] #next{display:none}
</style></head><body>
<div id="grad"></div><div id="grid"></div>
<div id="top"><span id="brand"></span><span id="count"></span></div>
<div id="zone"><div id="num"></div><div id="titre"></div><div id="rule"></div><div id="texte"></div><div id="button"></div></div>
<div id="bottom"><div id="bar"><div></div></div><span id="next">Glisse →</span></div>
<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  const KIND = ["couverture", "point", "fin"].includes(param("kind", "")) ? param("kind", "") : "point";
  document.documentElement.dataset.kind = KIND;
  const n = num("n", 1), total = Math.max(num("total", 1), 1);
  document.getElementById("brand").textContent = param("marque", "OpusCV");
  document.getElementById("count").textContent = `${n}/${total}`;
  document.getElementById("num").textContent = String(n - 1).padStart(2, "0");
  document.getElementById("bar").firstElementChild.style.width = `${(100 * n) / total}%`;
  document.getElementById("button").textContent = param("bouton", "Tester mon CV");
  const titre = frTypo(param("titre", "Trois erreurs qui font rater ton CV"));
  const titleEl = document.getElementById("titre");
  // Mot fort (couverture) : le plus long, surligne.
  const words = titre.split(/ +/);
  let hot = -1;
  if (KIND === "couverture") words.forEach((w, i) => { const l = w.replace(/[^\p{L}\p{N}%]/gu, "").length; if (l >= 4 && (hot < 0 || l > words[hot].length)) hot = i; });
  words.forEach((w, i) => {
    if (i) titleEl.append(" ");
    if (i === hot) { const m = w.match(/^(.*?)((?:\u00a0?[?!:;.,…»])*)$/u), s = document.createElement("span"); s.className = "hot"; s.textContent = m[1]; titleEl.append(s, m[2]); }
    else titleEl.append(w);
  });
  document.getElementById("texte").textContent = frTypo(param("texte", ""));
  if (!param("texte", "")) document.getElementById("rule").style.display = "none";

  FONTS_READY.then(() => {
    // Reduit titre puis texte tant que la zone deborde.
    const zone = document.getElementById("zone"), texte = document.getElementById("texte");
    for (let k = 0; k < 40 && zone.scrollHeight > zone.clientHeight; k++) {
      const ts = parseFloat(getComputedStyle(titleEl).fontSize), xs = parseFloat(getComputedStyle(texte).fontSize);
      if (ts > 60) titleEl.style.fontSize = `${ts - 6}px`;
      if (xs > 34 && (ts <= 60 || k % 2)) texte.style.fontSize = `${xs - 3}px`;
      if (ts <= 60 && xs <= 34) break;
    }
    const tl = gsap.timeline({ paused: true }).from("#zone", { y: 30, opacity: 0, duration: 0.3 }, 0);
    expose(tl);
  });
</script></body></html>
