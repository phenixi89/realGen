<!doctype html>
<!--
  Plan de documentaire animalier (format "documentaire_nature") : un paysage en silhouettes (habitat + moment de la
  journee), un ou plusieurs animaux qui jouent la scene, une camera qui avance ou balaie, une legende de documentaire
  (nom, nom latin, detail), le tout sous un grain de pellicule et un viseur de camera.
  Parametres : plan = JSON d'un plan (format dans documentaire/moteur.js, catalogue dans catalog/documentaire.json),
  dur = duree de la scene (s). Sans plan : plan de demonstration.
  Rendu : python scripts/render_js_anim.py --spec "documentaire?plan=%7B...%7D&dur=6" --out /tmp/doc.mp4
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
  #scene{position:absolute;inset:0}
  #chaleur{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,170,90,.10),rgba(255,120,60,.0) 45%,rgba(20,10,30,.18));mix-blend-mode:soft-light}
  #vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(0,0,0,.62) 100%)}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.2;mix-blend-mode:overlay}
  #viseur{position:absolute;inset:0;pointer-events:none}
  #legende{position:absolute;left:78px;top:236px;width:760px;color:#fff8e8;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  #legende .trait{width:150px;height:4px;background:#ffe9b0;margin-bottom:22px;transform-origin:0 50%;border-radius:2px}
  #legende .titre{font-family:TitleFont,"DejaVu Serif",serif;font-weight:800;font-size:58px;letter-spacing:3px;text-transform:uppercase;line-height:1.1}
  #legende .latin{font-family:TextFont,"DejaVu Serif",serif;font-style:italic;font-size:38px;margin-top:10px;color:#ffe9b0}
  #legende .detail{font-family:TextFont,"DejaVu Serif",serif;font-size:34px;margin-top:12px;opacity:.92;line-height:1.25}
  #erreur{position:absolute;left:40px;right:40px;top:40px;color:#ff6b6b;font:32px monospace;white-space:pre-wrap}
</style></head><body>
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<div id="chaleur"></div><div id="vignette"></div>
<svg id="grain" width="1080" height="1920"><filter id="bruit" x="0" y="0" width="100%" height="100%"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#bruit)"/></svg>
<svg id="viseur" viewBox="0 0 1080 1920" width="1080" height="1920" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6">
  <path d="M52 170 V132 H90"/><path d="M1028 170 V132 H990"/><path d="M52 1610 V1648 H90"/><path d="M1028 1610 V1648 H990"/>
  <circle id="rec" cx="1000" cy="196" r="9" fill="#ff3b30" stroke="none"/>
</svg>
<div id="legende"><div class="trait"></div><div class="titre"></div><div class="latin"></div><div class="detail"></div></div>
<div id="erreur"></div>
<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script src="documentaire/outils.js"></script>
<script src="documentaire/especes.js"></script>
<script src="documentaire/fonds.js"></script>
<script src="documentaire/moteur.js"></script>
<script>
  const DEMO = { habitat: "savane", moment: "crepuscule", cadre: "moyen", mouvement: "avant", duree: 6,
    sujets: [{ id: "a", espece: "suricate", x: 420 }, { id: "b", espece: "girafe", x: 800, profondeur: 0.5, regard: "gauche" }],
    actions: [{ qui: "a", action: "guetter", t: 0.8, duree: 4 }],
    legende: { titre: "Le chercheur d'emploi", latin: "Candidatus ignoratus", detail: "Habitat : la boîte mail" } };
  let plan;
  try { plan = JSON.parse(param("plan", "") || "null") || DEMO; } catch (e) { document.getElementById("erreur").textContent = "Plan invalide : " + e.message; }
  if (plan) {
    plan.duree = num("dur", plan.duree || 6);
    FONTS_READY.then(() => {
      try {
        const { tl, duree } = Doc.monter(plan, { svg: document.getElementById("scene"), legende: document.getElementById("legende") });
        const rec = document.getElementById("rec");
        tl.to(rec, { opacity: 0.15, duration: 0.5, yoyo: true, repeat: Math.ceil(duree / 0.5), ease: "steps(1)" }, 0);
        window.SONS = [];
        expose(tl);
        // Grain : une nouvelle graine toutes les 1/12 s (pellicule), fonction du temps seulement.
        const seek = window.seek;
        window.seek = (t) => { seek(t); document.getElementById("turb").setAttribute("seed", String(1 + Math.floor(t * 12) % 97)); };
        window.seek(0);
      } catch (e) { document.getElementById("erreur").textContent = "Plan : " + e.message; console.error(e); }
    });
  }
</script></body></html>
