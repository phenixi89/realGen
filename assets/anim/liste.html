<!doctype html>
<!--
  Carte "liste" : un titre, puis 2 a 5 points qui apparaissent et se cochent
  un par un. Parametres : titre, points (separes par "|"), surtitre, bg,
  dur + theme. Instants partages avec scripts/sound_design.py :
  FIRST_AT, itemGap(n) (cadence calee sur la duree de la scene).
-->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="_card_base.css">
<style>
  #box{position:absolute;left:90px;right:90px;top:480px}
  #title{margin-top:40px;font-size:84px}
  ul{list-style:none;padding:0;margin:50px 0 0}
  li{display:flex;align-items:center;gap:30px;font-size:54px;font-weight:700;margin:34px 0}
  .ck{flex:none;width:74px;height:74px;border-radius:22px;border:5px solid color-mix(in srgb,var(--cfg) 45%,transparent);
    display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;position:relative}
  .ck b{position:absolute;inset:-5px;border-radius:22px;background:var(--c1);color:var(--c1fg);display:flex;align-items:center;justify-content:center;opacity:0}
</style></head><body>
<div id="bg"></div><div id="grad"></div><div id="grid"></div>
<div id="box">
  <div class="kicker" id="kicker"></div>
  <div class="title" id="title"></div>
  <ul id="list"></ul>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  const FIRST_AT = 0.6, DUR = num("dur", 4);
  const points = param("points", "Un titre précis|Des résultats chiffrés|Un PDF propre").split("|").filter(Boolean).slice(0, 5);
  const itemGap = (n) => Math.min(0.7, Math.max(0.3, (DUR - FIRST_AT - 0.8) / Math.max(n, 1)));
  document.getElementById("title").textContent = param("titre", "");
  const kicker = param("surtitre", ""); document.getElementById("kicker").textContent = kicker;
  if (!kicker) document.getElementById("kicker").style.display = "none";
  const list = document.getElementById("list");
  points.forEach((p) => { const li = document.createElement("li");
    li.innerHTML = '<span class="ck"><b>✓</b></span><span></span>'; li.lastChild.textContent = p; list.appendChild(li); });
  const bg = param("bg", ""); let bgReady = null;
  if (bg) { document.getElementById("bg").style.backgroundImage = `url("${bg}")`;
    bgReady = new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = bg; }); }
  const tl = gsap.timeline({ paused: true })
    .fromTo("#bg", { scale: 1.15 }, { scale: 1, duration: 10, ease: "none" }, 0)
    .from("#kicker", { y: -40, opacity: 0, scale: 0.7, duration: 0.4, ease: "back.out(2.2)" }, 0.05)
    .from("#title", { y: 40, opacity: 0, duration: 0.45, ease: "power3.out" }, 0.2);
  const gap = itemGap(points.length);
  document.querySelectorAll("li").forEach((li, i) => {
    const t = FIRST_AT + i * gap;
    tl.from(li, { x: -80, opacity: 0, duration: 0.35, ease: "power3.out" }, t)
      .to(li.querySelector("b"), { opacity: 1, duration: 0.01 }, t + 0.2)
      .fromTo(li.querySelector("b"), { scale: 0.3 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, t + 0.2);
  });
  tl.to("#box", { y: -12, duration: 2.2, repeat: 4, yoyo: true, ease: "sine.inOut" }, FIRST_AT + points.length * gap + 0.4);
  addAmbient(tl);
  expose(tl, bgReady);
  window.DURATION = FIRST_AT + points.length * gap + 0.5;
</script></body></html>
