<!doctype html>
<!--
  Surimpression "score ATS" (mode overlay) : jauge qui monte a ?from=, hesite,
  puis grimpe a ?to=, liste de preuves (?lines= separees par "|"), puis fondu
  de sortie -- se pose par-dessus la demo sans la masquer entierement.
  Parametres : from, to, label, lines, cta (vide = pas de bouton).
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:TextFont,"DejaVu Sans",system-ui,sans-serif}
  #layer{position:absolute;inset:0}
  #dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 36%,rgba(10,8,30,.45),rgba(10,8,30,.78))}
  #card{position:absolute;left:130px;right:130px;top:250px;padding:70px 60px 60px;border-radius:60px;
    background:rgba(24,20,48,.72);border:2px solid rgba(255,255,255,.18);
    box-shadow:0 40px 90px rgba(0,0,0,.5);text-align:center;color:#fff}
  #label{font-weight:700;font-size:38px;letter-spacing:.3em;text-transform:uppercase;opacity:.75}
  #ring{width:440px;height:440px;margin:40px auto 30px;position:relative}
  #ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  #num{position:absolute;inset:0;font-family:TitleFont,"DejaVu Sans",sans-serif;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:150px;font-variant-numeric:tabular-nums}
  #num small{font-size:48px;opacity:.6;margin:50px 0 0 10px}
  .row{display:flex;align-items:center;gap:26px;font-weight:700;font-size:42px;margin:24px 0;text-align:left}
  .ck{flex:none;width:58px;height:58px;border-radius:50%;background:#22c58b;display:flex;align-items:center;justify-content:center;font-size:34px}
  #cta{position:absolute;left:0;right:0;top:1330px;text-align:center}
  #cta span{position:relative;overflow:hidden;display:inline-block;font-weight:800;font-size:58px;color:var(--c1fg);padding:30px 70px;border-radius:99px;
    background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 14px 40px color-mix(in srgb,var(--c1) 60%,transparent)}
  #shine{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%)}
  .p{position:absolute;width:18px;height:18px;border-radius:50%;left:50%;top:360px;margin-left:-9px;opacity:0}
</style></head><body>
<div id="layer">
  <div id="dim"></div>
  <div id="card">
    <div id="label"></div>
    <div id="ring">
      <svg viewBox="0 0 100 100">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5d6c"/><stop offset=".5" stop-color="#ffb547"/><stop offset="1" stop-color="#22c58b"/></linearGradient></defs>
        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="8"/>
        <circle id="arc" cx="50" cy="50" r="42" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264"/>
      </svg>
      <div id="num"><b id="val">0</b><small>/100</small></div>
    </div>
    <div id="rows"></div>
    <div id="particles"></div>
  </div>
  <div id="cta"><span><b id="ctatxt"></b><div id="shine"></div></span></div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  const FROM = num("from", 42), TO = num("to", 94), CTA = param("cta", "");
  const LINES = param("lines", "Mots-clés optimisés|Format lisible par les ATS|Expériences valorisées").split("|").filter(Boolean);
  document.getElementById("label").textContent = param("label", "Score ATS");
  document.getElementById("ctatxt").textContent = CTA;
  if (!CTA) document.getElementById("cta").style.display = "none";
  document.getElementById("rows").innerHTML = LINES.map((l) => `<div class="row"><span class="ck">✓</span><span></span></div>`).join("");
  document.querySelectorAll(".row span:last-child").forEach((s, i) => (s.textContent = LINES[i]));

  const C = 264, score = { v: 0 }, arc = document.getElementById("arc"), val = document.getElementById("val");
  const draw = () => { arc.style.strokeDashoffset = C * (1 - score.v / 100); val.textContent = Math.round(score.v); };
  // Particules a trajectoires calculees (pas de Math.random) : rendu reproductible.
  const pc = document.getElementById("particles"), cols = ["#22c58b", "var(--c1)", "#ffb547", "#fff"], parts = [];
  for (let i = 0; i < 18; i++) { const d = document.createElement("div"); d.className = "p"; d.style.background = cols[i % 4]; pc.appendChild(d); parts.push(d); }

  const tl = gsap.timeline({ paused: true, onUpdate: draw })
    .from("#dim", { opacity: 0, duration: 0.35 })
    .from("#card", { y: 120, scale: 0.9, opacity: 0, duration: 0.6, ease: "expo.out" }, "-=.15")
    .from("#label", { opacity: 0, letterSpacing: "1em", duration: 0.5 }, "-=.35")
    .to(score, { v: FROM, duration: 0.8, ease: "power2.out" })
    .to("#card", { x: -12, duration: 0.05, repeat: 3, yoyo: true }, "+=.05")
    .set("#card", { x: 0 })
    .to(score, { v: TO, duration: 1.3, ease: "power3.inOut" }, "+=.25")
    .to("#num", { scale: 1.18, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, "-=.05")
    .addLabel("burst", "-=.3");
  parts.forEach((p, i) => {
    const a = (i / parts.length) * Math.PI * 2, r = 260 + (i % 3) * 70;
    tl.fromTo(p, { x: 0, y: 0, opacity: 1, scale: 1 }, { immediateRender: false, x: Math.cos(a) * r, y: Math.sin(a) * r, opacity: 0, scale: 0.3, duration: 0.8, ease: "power3.out" }, "burst");
  });
  tl.from(".row", { x: -60, opacity: 0, duration: 0.4, stagger: 0.15, ease: "back.out(2)" }, "burst")
    .from(".ck", { scale: 0, duration: 0.3, stagger: 0.15, ease: "back.out(3)" }, "burst+=.1");
  if (CTA) tl.from("#cta span", { y: 80, scale: 0.6, opacity: 0, duration: 0.55, ease: "back.out(2)" }, "-=.1")
             .fromTo("#shine", { x: "-120%" }, { x: "120%", duration: 0.8, ease: "power1.inOut" }, "+=.1");
  tl.to("#layer", { opacity: 0, y: -40, duration: 0.45, ease: "power2.in" }, "+=1.1");
  expose(tl);
</script></body></html>
