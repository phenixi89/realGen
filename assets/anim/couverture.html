<!doctype html>
<!--
  Couverture d'un reel Instagram (image fixe 1080x1920), rendue par
  scripts/instagram.py. Le profil Instagram recadre la couverture en 3:4
  (1080x1440, centre) et parfois en carre : tout le texte tient dans la zone
  commune aux deux, y = 420..1500. Fond : uni aux couleurs du theme (?bg= optionnel : image floutee et
  assombrie). Titre = l'accroche, mot fort surligne.
  Parametres : titre, surtitre (optionnel), marque (defaut OpusCV), bg + theme.
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--cbg);color:var(--cfg);
    font-family:TextFont,"DejaVu Sans",system-ui,sans-serif}
  #bg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(26px) brightness(.45) saturate(1.15)}
  #grad{position:absolute;inset:0;background:
    radial-gradient(circle at 20% 25%,color-mix(in srgb,var(--c1) 45%,transparent),transparent 50%),
    radial-gradient(circle at 85% 75%,color-mix(in srgb,var(--c2) 38%,transparent),transparent 50%),
    linear-gradient(180deg,transparent,color-mix(in srgb,var(--cbg) 55%,transparent))}
  #zone{position:absolute;left:80px;right:80px;top:420px;height:1080px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  #kicker{display:inline-block;margin-bottom:46px;padding:14px 34px;border-radius:99px;background:var(--c1);color:var(--c1fg);font-weight:800;font-size:42px;letter-spacing:.06em;text-transform:uppercase}
  #titre{font-family:TitleFont,"DejaVu Sans",sans-serif;font-weight:800;font-size:128px;line-height:1.05;text-transform:uppercase;
    text-shadow:0 10px 40px rgba(0,0,0,.55)}
  #titre .hot{color:var(--c1fg);background:var(--c1);padding:0 .12em;border-radius:.1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  #brand{margin-top:60px;font-weight:800;font-size:40px;opacity:.85;letter-spacing:.04em}
</style></head><body>
<div id="bg"></div><div id="grad"></div>
<div id="zone"><div id="kicker"></div><div id="titre"></div><div id="brand"></div></div>
<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  const bg = param("bg", ""); let bgReady = null;
  if (bg) { document.getElementById("bg").style.backgroundImage = `url("${bg}")`;
    bgReady = new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = bg; }); }
  const kicker = param("surtitre", "");
  document.getElementById("kicker").textContent = kicker;
  if (!kicker) document.getElementById("kicker").style.display = "none";
  document.getElementById("brand").textContent = param("marque", "OpusCV");
  const titre = frTypo(param("titre", "Ton CV passe-t-il les filtres ?")), el = document.getElementById("titre");
  const words = titre.split(/ +/);
  let hot = -1;
  words.forEach((w, i) => { const l = w.replace(/[^\p{L}\p{N}%]/gu, "").length; if (l >= 4 && (hot < 0 || l > words[hot].replace(/[^\p{L}\p{N}%]/gu, "").length)) hot = i; });
  words.forEach((w, i) => {
    if (i) el.append(" ");
    if (i === hot) { const m = w.match(/^(.*?)((?:\u00a0?[?!:;.,…»])*)$/u), s = document.createElement("span"); s.className = "hot"; s.textContent = m[1]; el.append(s, m[2]); }
    else el.append(w);
  });
  FONTS_READY.then(() => {
    const zone = document.getElementById("zone");
    for (let k = 0; k < 30 && zone.scrollHeight > zone.clientHeight; k++)
      el.style.fontSize = `${Math.max(parseFloat(getComputedStyle(el).fontSize) - 6, 64)}px`;
    expose(gsap.timeline({ paused: true }).from("#zone", { scale: 0.96, duration: 0.3 }, 0), bgReady);
  });
</script></body></html>
