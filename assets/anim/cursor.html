<!doctype html>
<!--
  Curseur anime (surimpression d'une capture, 3b_build_video_from_screenshots
  --cursor) : la fleche entre par le bas, glisse jusqu'au bouton d'action
  (?x=&y=, px de la scene 1080x1920 -- captures.json "focus"), clique (le
  curseur s'enfonce, une onde part du point), puis s'efface. Suit le zoom de
  la capture comme highlight.html (common.js zoomCss).
  Instants partages avec scripts/sound_design.py : CLICK_AT (clic).
  Parametres : x, y, delay, zoom/step/zmax/fps/fx/fy, + theme.
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
  #layer{position:absolute;inset:0;transform-origin:0 0}
  #cursor{position:absolute;left:0;top:0;width:86px;height:86px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
  .ring{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
    border:6px solid var(--c1);opacity:0}
  #spot{position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--c1) 45%,transparent),transparent 70%);opacity:0}
</style></head><body>
<div id="layer">
  <div id="spot"></div>
  <div class="ring" id="r1"></div><div class="ring" id="r2"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2l17 10.2-7.3 1.6 4.4 7.6-3 1.7-4.4-7.6L4.6 21z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  const X = num("x", 700), Y = num("y", 1200), DELAY = num("delay", 0);
  const CLICK_AT = 1.0;
  // Pointe de la fleche = coin haut-gauche du SVG (decalage 8 px pour la pointe du trace).
  const tipX = X - 8, tipY = Y - 6;
  gsap.set(["#r1", "#r2", "#spot"], { x: X, y: Y });
  const tl = gsap.timeline({ paused: true })
    .fromTo("#cursor", { x: X + 320, y: Math.min(Y + 520, 1900), opacity: 0 },
      { x: tipX, y: tipY, opacity: 1, duration: CLICK_AT - 0.1, ease: "power3.out" }, 0)
    .to("#cursor", { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "10% 8%" }, CLICK_AT)
    .fromTo("#spot", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, immediateRender: false }, CLICK_AT)
    .fromTo("#r1", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 3.2, duration: 0.6, ease: "power2.out", immediateRender: false }, CLICK_AT)
    .fromTo("#r2", { opacity: 0.7, scale: 0.4 }, { opacity: 0, scale: 2.2, duration: 0.6, ease: "power2.out", immediateRender: false }, CLICK_AT + 0.12)
    .to("#spot", { opacity: 0, duration: 0.5 }, CLICK_AT + 0.6)
    .to("#cursor", { x: tipX + 40, y: tipY + 30, opacity: 0, duration: 0.45, ease: "power2.in" }, CLICK_AT + 1.0);
  expose(tl);
  const layer = document.getElementById("layer"), baseSeek = window.seek;
  window.seek = (t) => { baseSeek(t - DELAY); layer.style.transform = zoomCss(t); };
  window.DURATION = DELAY + tl.duration();
  window.seek(0);
</script></body></html>
