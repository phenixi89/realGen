<!doctype html>
<!--
  Plan "civique" (chaine examen_civique, theme civique_plateau) : un plateau de quiz aux couleurs du logo « L'Hexagone
  validé » — fond marine, alvéoles d'hexagones qui dérivent, projecteur, onglet + progression en petits hexagones.
  Toutes les cartes du reel y sont dessinées (catalog.gabarit_carte, famille "civique"), ainsi que l'accroche
  (scène 1) et l'écran d'appel à l'action (run_pipeline.plan_montage).
  Parametres : mode, texte (mots clés entre *...*), n, total, etiquette ({n}, {total} remplacés ; sinon « QUESTION n/N »),
  verdict (VRAI | FAUX : badge hexagonal tamponné à VERDICT_AT), icone (icones.js), note, dur.
  mode (la « planche ») :
    fait        texte qui s'écrit mot à mot, icône dessinée dans un grand hexagone
    retenir     « À RETENIR » : la phrase dans une plaque, tampon hexagone + coche
    chiffre     grand = le nombre, dans un hexagone tricolore qui se trace ; legende
    quiz        texte = question, points = 3 réponses, bonne = 1..3 : compte à rebours 3-2-1 dans un hexagone,
                la bonne réponse s'allume en vert avec la coche du logo, les autres s'éteignent
    liste       texte = titre, points a|b|c : alvéoles numérotées qui se cochent
    etapes      texte = titre, points = 3 étapes reliées par un trait
    avant_apres avant, apres (titre_avant, titre_apres) : la mauvaise version se barre, la bonne arrive avec sa coche
    accroche    icone dessinée dans l'hexagone (sous l'accroche affichée en haut par le montage) ; titre optionnel
    fin         appel à l'action : le logo se trace, brand (nom), title, sub, button
  Sons : publiés par la page (window.SONS, lus par render_js_anim.render_clip) -- rien a recopier dans sound_design.py.
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
  @font-face{font-family:CVTitle;src:url("../fonts/Anton-Regular.ttf")}
  @font-face{font-family:CVText;src:url("../fonts/Poppins-ExtraBold.ttf")}
  :root{--marine:#14204F;--nuit:#0c1538;--bleu:#2D5BE3;--rouge:#EF3E4A;--creme:#FFF7EA;--or:#FFC94A;--vert:#22B573;
    --ink-ink:#FFF7EA;--ink-a1:#2D5BE3;--ink-a2:#EF3E4A}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--nuit);color:var(--creme);font-family:CVText,sans-serif}
  #fond{position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 38%,#24357a 0%,var(--marine) 45%,var(--nuit) 100%)}
  #alveoles{position:absolute;left:-200px;top:-200px;width:1480px;height:2320px;opacity:.16}
  #projo{position:absolute;left:140px;top:-300px;width:800px;height:1300px;background:radial-gradient(ellipse at 50% 0%,rgba(255,247,234,.22),transparent 65%);
    transform-origin:50% 0;filter:blur(8px)}
  #bande{position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(90deg,var(--bleu),#fff 50%,var(--rouge))}
  #haut{position:absolute;left:80px;right:80px;top:170px;display:flex;align-items:center;justify-content:space-between}
  #lab{font-family:CVTitle,sans-serif;font-size:54px;letter-spacing:.06em;color:var(--marine);background:var(--creme);padding:10px 34px 6px;
    clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,18px 100%,0 50%)}
  #prog{display:flex;gap:14px}
  #prog i{display:block;width:40px;height:46px;background:rgba(255,247,234,.22);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
  #prog i.on{background:linear-gradient(135deg,var(--bleu),var(--rouge))}
  #zone{position:absolute;inset:0}
  .abs{position:absolute;left:90px;right:90px}
  .texte{font-size:104px;line-height:1.22;letter-spacing:-.01em}
  .m{display:inline-block;position:relative;margin:0 .2em 0 0;white-space:nowrap}
  .m.cle{color:var(--or)}
  .m.cle::after{content:"";position:absolute;left:0;right:0;bottom:.02em;height:.1em;border-radius:.05em;
    background:linear-gradient(90deg,var(--bleu),#fff,var(--rouge));transform:scaleX(var(--ul,0));transform-origin:0 50%}
  mark{background:none;color:var(--or)}
  svg{position:absolute;left:0;top:0;overflow:visible}
  .pod{display:flex;align-items:center;gap:36px;height:170px;padding:0 40px 0 26px;margin-bottom:46px;border-radius:28px;
    background:rgba(255,247,234,.08);border:5px solid rgba(255,247,234,.35);font-size:66px;line-height:1.1;box-shadow:0 18px 40px rgba(0,0,0,.35)}
  .hexb{flex:none;width:120px;height:136px;display:flex;align-items:center;justify-content:center;font-family:CVTitle,sans-serif;font-size:72px;
    color:var(--marine);background:var(--creme);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
  .plaque{position:absolute;left:90px;right:90px;padding:80px 60px 60px;border-radius:30px;background:var(--creme);color:var(--marine);
    font-size:76px;line-height:1.2;box-shadow:0 26px 60px rgba(0,0,0,.45)}
  .plaque .tab{position:absolute;left:40px;top:-38px;font-family:CVTitle,sans-serif;font-size:52px;letter-spacing:.06em;color:#fff;padding:6px 30px 2px;border-radius:12px}
  .plaque mark{color:var(--bleu)}
  .barre{position:absolute;left:36px;right:36px;top:52%;height:14px;border-radius:7px;background:var(--rouge);transform-origin:0 50%}
  #verdict{position:absolute;left:760px;top:250px;width:260px;height:300px;display:none}
  #note{position:absolute;left:150px;right:150px;top:1440px;padding:26px 40px;border-radius:24px;background:rgba(255,247,234,.12);
    border:4px solid rgba(255,247,234,.4);font-size:48px;line-height:1.25;text-align:center;display:none}
  #brand{font-family:CVTitle,sans-serif;font-size:150px;line-height:.95;text-align:center;letter-spacing:.02em}
  #brand b{font-weight:400;background:linear-gradient(90deg,var(--bleu),#fff 50%,var(--rouge));-webkit-background-clip:text;background-clip:text;color:transparent}
  #bouton{display:inline-block;font-family:CVTitle,sans-serif;font-size:72px;letter-spacing:.04em;color:#fff;padding:22px 80px 16px;
    background:linear-gradient(90deg,var(--bleu),var(--rouge));clip-path:polygon(40px 0,calc(100% - 40px) 0,100% 50%,calc(100% - 40px) 100%,40px 100%,0 50%)}
</style></head><body>
<div id="fond"></div>
<svg id="alveoles" width="1480" height="2320"></svg>
<div id="projo"></div>
<div id="bande"></div>
<div id="haut"><b id="lab"></b><div id="prog"></div></div>
<div id="zone"></div>
<svg id="dessin" width="1080" height="1920"></svg>
<div id="note"></div>
<svg id="verdict" viewBox="0 0 260 300"></svg>
<script src="vendor/gsap.min.js"></script>
<script src="common.js"></script>
<script src="icones.js"></script>
<script src="sketch.js"></script>
<script>
  const DUR = num("dur", 4);
  const FIRST_AT = 0.3, VERDICT_AT = 0.45;
  const mode = param("mode", "fait"), N = Math.round(num("n", 1)), TOTAL = Math.max(Math.round(num("total", 3)), N);
  const texte = frTypo(param("texte", "La devise : *Liberté*, Égalité, Fraternité")), icone = param("icone", ""), note = param("note", "");
  const points = param("points", "Premier point|Deuxième point|Troisième point").split("|").filter(Boolean).slice(0, 5);
  const SONS = [], son = (t, name, extra) => SONS.push({ t: +t.toFixed(3), name, ...(extra || {}) });
  const NS = "http://www.w3.org/2000/svg";
  const hexPts = (cx, cy, r) => [...Array(6)].map((_, i) => { const a = Math.PI / 180 * (60 * i - 90); return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
  const esc = (v) => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const hl = (v) => esc(frTypo(v)).replace(/\*([^*]+)\*/g, "<mark>$1</mark>");
  const zone = document.getElementById("zone"), dessin = document.getElementById("dessin");
  const add = (cls, html, css, parent) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; Object.assign(d.style, css || {}); (parent || zone).appendChild(d); return d; };
  const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || dessin).appendChild(e); return e; };
  const degrade = (id, parent) => { const d = svgEl("defs", {}, parent); d.innerHTML = `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2D5BE3"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#EF3E4A"/></linearGradient>`; };
  degrade("tri");

  // Fond : alveoles d'hexagones (derivent lentement).
  (() => { const a = document.getElementById("alveoles"); let html = "";
    for (let row = 0; row < 26; row++) for (let col = 0; col < 13; col++) {
      const cx = col * 120 + (row % 2) * 60, cy = row * 104; html += `<polygon points="${hexPts(cx, cy, 58)}" fill="none" stroke="#9fb4ff" stroke-width="3"/>`; }
    a.innerHTML = html; })();

  // En-tete : onglet (etiquette) + progression en hexagones. Ni sur l'accroche ni sur l'appel a l'action.
  const ETIQ = param("etiquette", ""), RESUME = mode === "retenir";
  const lab = document.getElementById("lab"), prog = document.getElementById("prog");
  if (mode === "accroche" || mode === "fin") document.getElementById("haut").style.display = "none";
  lab.textContent = RESUME ? "À RETENIR" : ETIQ ? ETIQ.replace("{n}", N).replace("{total}", TOTAL) : `QUESTION ${N}/${TOTAL}`;
  if (!RESUME) for (let i = 1; i <= TOTAL; i++) { const h = document.createElement("i"); if (i <= N) h.className = "on"; prog.appendChild(h); }

  // Texte mot a mot : les mots *cles* passent en or et se soulignent en tricolore.
  function motAMot(el, txt, t0, gap) {
    const mots = [];
    (txt.match(/\*[^*]+\*[^\s*]*|[^\s*]+/g) || []).forEach((tok) => { const cle = tok.startsWith("*"), m = document.createElement("span");
      m.className = "m" + (cle ? " cle" : ""); m.textContent = cle ? tok.replace(/\*/g, "") : tok; el.appendChild(m); mots.push(m); });
    if (mots.length > 10) el.style.fontSize = "86px";
    const g = gap ?? Math.min(0.3, Math.max(0.12, (DUR * 0.55 - t0) / Math.max(mots.length, 1)));
    mots.forEach((m, i) => { const t = t0 + i * g; tl.from(m, { y: 40, opacity: 0, scale: 0.85, duration: 0.22, ease: "back.out(2.2)" }, t);
      if (m.classList.contains("cle")) tl.fromTo(m, { "--ul": 0 }, { "--ul": 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t + 0.15);
      son(t, "click", { gain: 0.35 }); });
    return t0 + mots.length * g;
  }
  // Hexagone qui se trace (contour tricolore), optionnellement rempli.
  function hexagone(cx, cy, r, t, o = {}) {
    const p = svgEl("polygon", { points: hexPts(cx, cy, r), fill: o.fill || "none", stroke: o.stroke || "url(#tri)", "stroke-width": o.width || 22, "stroke-linejoin": "round" }, o.parent);
    const len = 6 * r; p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    tl.to(p, { strokeDashoffset: 0, duration: o.dur || 0.6, ease: "power2.inOut" }, t);
    if (o.fill) tl.from(p, { fillOpacity: 0, duration: 0.3 }, t + 0.3);
    return p;
  }
  // Coche du logo (trait epais creme) qui se trace.
  function coche(cx, cy, s, t, couleur, parent) {
    const p = svgEl("path", { d: `M${cx - 160 * s} ${cy + 8 * s} L${cx - 42 * s} ${cy + 126 * s} L${cx + 188 * s} ${cy - 120 * s}`, fill: "none",
      stroke: couleur || "#FFF7EA", "stroke-width": 86 * s, "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
    const len = 520 * s; p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    tl.to(p, { strokeDashoffset: 0, duration: 0.35, ease: "power3.out" }, t); return p;
  }
  function croix(cx, cy, s, t, parent) {
    const p = svgEl("path", { d: `M${cx - 110 * s} ${cy - 110 * s} L${cx + 110 * s} ${cy + 110 * s} M${cx + 110 * s} ${cy - 110 * s} L${cx - 110 * s} ${cy + 110 * s}`,
      fill: "none", stroke: "#FFF7EA", "stroke-width": 70 * s, "stroke-linecap": "round" }, parent);
    tl.from(p, { scale: 0, svgOrigin: `${cx} ${cy}`, duration: 0.25, ease: "back.out(3)" }, t); return p;
  }
  function icon(cx, cy, size, t) {
    if (!icone || !(window.ICONES || {})[icone]) return null;
    const sk = new Sketch(dessin, { seed: icone.length * 7 + texte.length, width: 12 });
    sk.icon(icone, cx, cy, size, { color: "#FFF7EA" });
    sk.draw.timeScale(Math.max(1, sk.draw.duration() / Math.max(DUR * 0.5, 0.8)));
    tl.add(sk.draw, t); son(t, "feutre", { duration: Math.min(sk.draw.duration() / sk.draw.timeScale(), 1.6) });
    return { sk, t };
  }

  const tl = gsap.timeline({ paused: true });
  let fin = FIRST_AT, croquis = null;
  function construire() {
    tl.from("#fond", { opacity: 0, duration: 0.25 }, 0)
      .fromTo("#alveoles", { x: 0, y: 0 }, { x: -60, y: -104, duration: Math.max(DUR, 3), ease: "none" }, 0)
      .fromTo("#projo", { rotation: -10 }, { rotation: 10, duration: Math.max(DUR, 3), ease: "sine.inOut" }, 0)
      .from("#haut", { y: -60, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 0.05);
    son(0.05, "pop", { gain: 0.6 });

    if (mode === "fait" || mode === "retenir") {
      if (mode === "retenir") {
        const pl = add("plaque", `<span class="tab" style="background:var(--rouge)">À RETENIR</span><div class="txt"></div>`, { top: "520px", fontSize: "88px" });
        tl.from(pl, { y: 120, opacity: 0, rotation: -3, duration: 0.4, ease: "back.out(1.8)" }, 0.15);
        fin = motAMot(pl.querySelector(".txt"), texte, FIRST_AT + 0.2);
        const g = svgEl("g", {}); const cy = 1330;
        hexagone(540, cy, 150, fin + 0.2, { fill: "#14204F", width: 18, parent: g }); coche(540, cy, 0.42, fin + 0.55, null, g);
        tl.from(g, { scale: 2.4, opacity: 0, svgOrigin: `540 ${cy}`, duration: 0.25, ease: "power4.in" }, fin + 0.2);
        son(fin + 0.4, "impact", { gain: 0.6 }); fin += 0.9;
      } else {
        const t = add("abs texte", "", { top: "420px" });
        fin = motAMot(t, texte, FIRST_AT);
        if (icone && (window.ICONES || {})[icone]) { hexagone(540, 1150, 250, Math.min(fin, DUR * 0.4), { width: 18 }); croquis = icon(540, 1150, 300, Math.min(fin, DUR * 0.4) + 0.3); }
        else if (/\?\s*$/.test(texte)) {   // une question : un « ? » qui attend la reponse, jamais une coche avant elle
          hexagone(540, 1150, 170, fin, { fill: "#14204F", width: 16 });
          const q = svgEl("text", { x: 540, y: 1215, "text-anchor": "middle", "font-family": "CVTitle", "font-size": 190, fill: "#FFC94A" });
          q.textContent = "?"; tl.from(q, { opacity: 0, scale: 0.3, svgOrigin: "540 1150", duration: 0.3, ease: "back.out(3)" }, fin + 0.3); son(fin + 0.3, "pop");
        } else { const g = svgEl("g", {}); hexagone(540, 1150, 170, fin, { fill: "#14204F", width: 16, parent: g }); coche(540, 1150, 0.5, fin + 0.35, null, g); son(fin + 0.35, "ding", { gain: 0.6 }); }
        if (note) { const n = document.getElementById("note"); n.style.display = "block"; n.textContent = frTypo(note);
          tl.from(n, { y: 60, opacity: 0, duration: 0.35, ease: "back.out(2)" }, fin + 0.2); son(fin + 0.2, "pop"); }
      }
    } else if (mode === "chiffre") {
      const grand = param("grand", "75%"), fs = Math.min(330, Math.floor(620 / (grand.length * 0.5)));
      hexagone(540, 820, 330, FIRST_AT, { width: 26, dur: 0.7 });
      const g = add("abs", esc(grand), { top: `${820 - fs * 0.55}px`, fontFamily: "CVTitle,sans-serif", fontSize: `${fs}px`, lineHeight: 1.1, textAlign: "center", whiteSpace: "nowrap" });
      tl.from(g, { scale: 2.4, opacity: 0, duration: 0.3, ease: "power4.in" }, FIRST_AT + 0.45); son(FIRST_AT + 0.7, "impact", { gain: 0.6 });
      const lg = add("abs", hl(param("legende", texte)), { top: "1250px", fontSize: "80px", lineHeight: 1.2, textAlign: "center" });
      tl.from(lg, { y: 50, opacity: 0, duration: 0.35, ease: "power3.out" }, FIRST_AT + 1.0); fin = FIRST_AT + 1.6;
    } else if (mode === "quiz") {
      const q = add("abs", hl(texte), { top: "360px", fontSize: "84px", lineHeight: 1.2, right: "330px" });
      tl.from(q, { y: 40, opacity: 0, duration: 0.35, ease: "power3.out" }, FIRST_AT);
      const bonne = Math.min(Math.max(Math.round(num("bonne", 1)), 1), points.length), box = add("abs", "", { top: "820px" }), pods = [];
      const gap = Math.min(0.6, Math.max(0.3, (DUR * 0.45) / points.length));
      points.forEach((pt, i) => { const p = add("pod", `<span class="hexb">${"ABC"[i]}</span><span>${hl(pt)}</span>`, {}, box); pods.push(p);
        const t = FIRST_AT + 0.6 + i * gap; tl.from(p, { x: 160, opacity: 0, duration: 0.3, ease: "power3.out" }, t); son(t, "pop"); });
      const finOpts = FIRST_AT + 0.6 + points.length * gap, rev = Math.max(finOpts + 1.2, DUR - 0.8);
      // Compte a rebours 3-2-1 dans un hexagone (en haut a droite), de la fin des reponses a la revelation.
      const cx = 880, cy = 470, ring = svgEl("polygon", { points: hexPts(cx, cy, 110), fill: "rgba(255,247,234,.08)", stroke: "url(#tri)", "stroke-width": 16, "stroke-linejoin": "round" });
      ring.style.strokeDasharray = 660; tl.from(ring, { opacity: 0, scale: 0.4, svgOrigin: `${cx} ${cy}`, duration: 0.3, ease: "back.out(2)" }, finOpts - 0.3)
        .fromTo(ring, { strokeDashoffset: 0 }, { strokeDashoffset: 660, duration: rev - finOpts, ease: "none", immediateRender: false }, finOpts);
      const pas = (rev - finOpts) / 3;
      [3, 2, 1].forEach((k, i) => { const d = svgEl("text", { x: cx, y: cy + 48, "text-anchor": "middle", "font-family": "CVTitle", "font-size": 150, fill: "#FFF7EA", opacity: 0 });
        d.textContent = k; const t = finOpts + i * pas;
        tl.to(d, { opacity: 1, duration: 0.05 }, t).from(d, { scale: 1.8, svgOrigin: `${cx} ${cy - 50}`, duration: 0.25, ease: "power3.out" }, t).to(d, { opacity: 0, duration: 0.05 }, t + pas - 0.05);
        son(t, "tick", { gain: 0.7 }); });
      tl.to(ring, { opacity: 0, duration: 0.2 }, rev);
      pods.forEach((p, i) => { if (i === bonne - 1) {
          tl.to(p, { backgroundColor: "rgba(34,181,115,.9)", borderColor: "#7dffb8", scale: 1.04, duration: 0.25, ease: "back.out(3)" }, rev)
            .to(p.querySelector(".hexb"), { backgroundColor: "#FFF7EA", color: "#22B573", duration: 0.2 }, rev);
        } else tl.to(p, { opacity: 0.25, x: i % 2 ? 12 : -12, duration: 0.2 }, rev).to(p, { x: 0, duration: 0.15 }, rev + 0.2); });
      son(rev, "ding"); fin = rev + 0.5;
    } else if (mode === "liste" || mode === "etapes") {
      const t = add("abs", hl(texte), { top: "380px", fontSize: "92px", lineHeight: 1.15 });
      tl.from(t, { y: 40, opacity: 0, duration: 0.35, ease: "power3.out" }, FIRST_AT);
      const pts = mode === "etapes" ? points.slice(0, 3) : points, gap = Math.min(0.8, Math.max(0.35, (DUR * 0.7 - FIRST_AT) / pts.length));
      if (mode === "etapes" && pts.length > 1) { const l = svgEl("line", { x1: 150, y1: 820, x2: 150, y2: 820 + (pts.length - 1) * 300, stroke: "url(#tri)", "stroke-width": 12, "stroke-linecap": "round" });
        tl.from(l, { attr: { y2: 820 }, duration: gap * (pts.length - 1), ease: "none" }, FIRST_AT + 0.6); }
      pts.forEach((pt, i) => { const top = (mode === "etapes" ? 750 + i * 300 : 760 + i * 220), t = FIRST_AT + 0.5 + i * gap;
        const row = add("abs", `<span class="hexb" style="width:140px;height:158px">${mode === "etapes" ? i + 1 : "✓"}</span><span style="flex:1">${hl(pt)}</span>`,
          { top: top + "px", display: "flex", alignItems: "center", gap: "40px", fontSize: "66px", lineHeight: 1.12 });
        tl.from(row, { x: -120, opacity: 0, duration: 0.3, ease: "power3.out" }, t)
          .from(row.querySelector(".hexb"), { scale: 0, rotation: -60, duration: 0.3, ease: "back.out(2.5)" }, t + 0.1);
        son(t + 0.1, "pop"); fin = t + 0.6; });
    } else if (mode === "avant_apres") {
      const c1 = add("plaque", `<span class="tab" style="background:var(--rouge)">${esc(param("titre_avant", "AVANT"))}</span>${hl(param("avant", "Une idée reçue"))}<span class="barre"></span>`, { top: "460px", transform: "rotate(-1.5deg)", fontSize: "68px" });
      const c2 = add("plaque", `<span class="tab" style="background:var(--vert)">${esc(param("titre_apres", "APRÈS"))}</span>${hl(param("apres", "La bonne réponse"))}`, { top: "1000px", transform: "rotate(1deg)", fontSize: "68px" });
      tl.from(c1, { y: 120, opacity: 0, duration: 0.4, ease: "back.out(1.8)" }, FIRST_AT)
        .fromTo(c1.querySelector(".barre"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false }, FIRST_AT + 1.0)
        .to(c1, { opacity: 0.5, duration: 0.2 }, FIRST_AT + 1.3)
        .from(c2, { y: 160, opacity: 0, scale: 0.9, duration: 0.45, ease: "back.out(2)" }, FIRST_AT + 1.5);
      son(FIRST_AT + 1.0, "buzz", { gain: 0.6 }); son(FIRST_AT + 1.6, "ding"); fin = FIRST_AT + 2.2;
    } else if (mode === "accroche") {
      const titre = param("titre", "");
      if (titre) { const t = add("abs", hl(titre), { top: "380px", fontSize: "88px", lineHeight: 1.2, textAlign: "center" }); tl.from(t, { y: 40, opacity: 0, duration: 0.35 }, FIRST_AT); }
      hexagone(540, 1130, 300, 0.15, { width: 20, dur: 0.7 });
      const g = svgEl("g", {}); svgEl("polygon", { points: hexPts(540, 1130, 250), fill: "rgba(255,247,234,.07)" }, g);
      tl.from(g, { opacity: 0, duration: 0.4 }, 0.3);
      croquis = icon(540, 1130, 330, 0.35) || null;
      if (!croquis) { coche(540, 1130, 0.7, 0.6); son(0.6, "ding", { gain: 0.6 }); }
      fin = 1.4;
    } else if (mode === "fin") {
      document.getElementById("projo").style.opacity = 1.4;
      const g = svgEl("g", {}); hexagone(540, 640, 230, 0.1, { width: 30, dur: 0.6, parent: g, fill: "#14204F" }); coche(540, 640, 0.62, 0.65, null, g);
      svgEl("circle", { cx: 540 + 188 * 0.62, cy: 640 - 120 * 0.62, r: 16, fill: "#EF3E4A" }, g);
      son(0.65, "ding");
      const brand = param("brand", "Objectif Civique"), parts = brand.split(" ");
      const b = add("abs", "", { top: "960px" }); b.id = "brand";
      b.innerHTML = parts.length > 1 ? `${esc(parts.slice(0, -1).join(" ").toUpperCase())}<br><b>${esc(parts[parts.length - 1].toUpperCase())}</b>` : `<b>${esc(brand.toUpperCase())}</b>`;
      if (brand.length > 14) b.style.fontSize = "132px";
      tl.from(b, { y: 80, opacity: 0, duration: 0.4, ease: "back.out(2)" }, 0.9);
      const ti = add("abs", hl(param("title", "Une question par jour")), { top: "1310px", fontSize: "64px", textAlign: "center", lineHeight: 1.2 });
      const sub = add("abs", hl(param("sub", "Abonne-toi pour réviser")), { top: "1410px", fontSize: "44px", textAlign: "center", color: "#9fb0e8" });
      const bt = add("abs", `<span id="bouton">${esc(param("button", "S'abonner").toUpperCase())}</span>`, { top: "1510px", textAlign: "center" });
      tl.from(ti, { y: 40, opacity: 0, duration: 0.3 }, 1.2).from(sub, { opacity: 0, duration: 0.3 }, 1.35)
        .from(bt, { scale: 0.4, opacity: 0, duration: 0.35, ease: "back.out(2.5)" }, 1.5)
        .to(bt, { scale: 1.06, duration: 0.45, repeat: 5, yoyo: true, ease: "sine.inOut" }, 2.0);
      son(1.5, "sparkle"); fin = 2.0;
    }

    // Verdict VRAI / FAUX : badge hexagonal tamponne, coche ou croix.
    const V = param("verdict", "").toUpperCase();
    if (V === "VRAI" || V === "FAUX") {
      const v = document.getElementById("verdict"); v.style.display = "block";
      const couleur = V === "VRAI" ? "#22B573" : "#EF3E4A";
      svgEl("polygon", { points: hexPts(130, 120, 115), fill: couleur, stroke: "#FFF7EA", "stroke-width": 10, "stroke-linejoin": "round" }, v);
      if (V === "VRAI") coche(130, 112, 0.36, VERDICT_AT + 0.1, null, v); else croix(130, 120, 0.42, VERDICT_AT + 0.1, v);
      const tx = svgEl("text", { x: 130, y: 292, "text-anchor": "middle", "font-family": "CVTitle", "font-size": 64, fill: couleur, "letter-spacing": 4 }, v); tx.textContent = V;
      tl.fromTo(v, { opacity: 0, scale: 2.6, rotation: -12 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.22, ease: "power4.in", immediateRender: false }, VERDICT_AT);
      son(VERDICT_AT + 0.2, V === "VRAI" ? "ding" : "buzz", { gain: 0.7 });
    }
  }

  Promise.all([FONTS_READY, window.HAND_READY, document.fonts.load("100px CVTitle"), document.fonts.load("60px CVText")]).then(() => {
    construire();
    tl.to({}, { duration: 0.01 }, Math.max(DUR, fin + 0.6));
    expose(tl);
    window.SONS = SONS.filter((s) => s.t < Math.max(DUR, 0.5)).sort((a, b) => a.t - b.t);   // lus par render_js_anim.py
    if (croquis) { const base = window.seek; window.seek = (t) => { base(t); croquis.sk.updatePen((t - croquis.t) * croquis.sk.draw.timeScale()); }; }
    window.DURATION = Math.max(DUR, fin + 0.6);
    window.seek(0);
  });
</script></body></html>
